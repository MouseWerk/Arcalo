name: Android

# The Android companion app (docs/android.md): a universal APK for arm64, armv7 and x86_64.
# Signed with the release key when the four ANDROID_* secrets exist (docs/release/android.md),
# else with a debug key (installable for a test, not for an update of a release install).
on:
  workflow_dispatch:
  # CI (ci.yml) builds it on every push, with the debug APK of the emulator tests; the release
  # (release.yml) builds the APK of its tag and attaches it to the release.
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.15.0 (empty: the commit of the calling run)"
        required: false
        type: string
        default: ""

# Per calling workflow: a release does not cancel the APK of a push to main, nor the other way round.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      # A release: the tag is the version (the APK's versionName and versionCode come from it).
      - name: Version from tag
        if: inputs.tag
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            const t = "Cargo.toml";
            fs.writeFileSync(t, fs.readFileSync(t, "utf8").replace(/^version = "[^"]*"/m, `version = "${process.env.VERSION}"`));
          '
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK (preinstalled on the runner)
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "Using the NDK in $ANDROID_NDK_LATEST_HOME"
          # Newer NDKs ship only llvm-ar and llvm-ranlib; the OpenSSL build asks for <triple>-ar and
          # <triple>-ranlib. Point both the cc variables and the prefixed names at the LLVM tools.
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/llvm-ar" && test -x "$bin/llvm-ranlib"
          shim="$RUNNER_TEMP/ndk-shims"
          mkdir -p "$shim"
          for triple in aarch64-linux-android armv7-linux-androideabi armv7a-linux-androideabi arm-linux-androideabi x86_64-linux-android; do
            ln -sf "$bin/llvm-ar" "$shim/$triple-ar"
            ln -sf "$bin/llvm-ranlib" "$shim/$triple-ranlib"
          done
          echo "$shim" >> "$GITHUB_PATH"
          echo "$bin" >> "$GITHUB_PATH"
          for t in aarch64_linux_android armv7_linux_androideabi x86_64_linux_android; do
            echo "AR_$t=$bin/llvm-ar" >> "$GITHUB_ENV"
            echo "RANLIB_$t=$bin/llvm-ranlib" >> "$GITHUB_ENV"
          done
      # The phone has no git program: its sync runs on libgit2. The sync's tests on libgit2, on the
      # runner (the same commands and checks as with the git program).
      - name: Sync on libgit2 (host tests)
        run: cargo test -p arcalo-core --features embedded-git --lib -- gitsync companion
        env:
          ARCALO_TEST_EMBEDDED_GIT: "1"
      - run: npm ci --prefix ui
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/arcalo-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/arcalo-release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > src-tauri/gen/android/keystore.properties
            echo "Signing with the release key."
          elif [ -n "$TAG" ]; then
            # Every runner makes a new debug key: a debug-signed release APK cannot update the
            # installed app (the app explains that instead of offering the update).
            echo "::warning title=Debug-signed release APK::The ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets are not set: the release APK is signed with a debug key and cannot update an installed app (see docs/release/android.md)."
          else
            echo "::notice title=Debug-signed APK::The ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets are not set: the APK is signed with a debug key (see docs/release/android.md)."
          fi
      # A release with the update-signing key: the app's update check is compiled in (the public
      # key, as for the desktop) and the APK is signed for it below. Other builds never check.
      - name: Update key
        if: inputs.tag
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "ARCALO_UPDATER_PUBKEY=$(tr -d '\r\n' < src-tauri/updater.pub)" >> "$GITHUB_ENV"
            echo "UPDATER_SIGN=1" >> "$GITHUB_ENV"
          else
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY: the APK is built without its update check and not signed for it."
          fi
      - name: Build the APK
        working-directory: src-tauri
        run: cargo tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: Name the APK
        run: |
          mkdir -p dist-android
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" "dist-android/Arcalo_${VERSION:-${GITHUB_SHA::8}}_android.apk"
          ls -l dist-android
      # The update signature (minisign, the desktop's key) with the version in its signed comment;
      # the release's publish job turns it into android-latest.json.
      - name: Sign the APK for the app's updates
        if: env.UPDATER_SIGN == '1'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri signer sign --app-version "$VERSION" "dist-android/Arcalo_${VERSION}_android.apk"
          test -s "dist-android/Arcalo_${VERSION}_android.apk.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: arcalo-android-apk
          path: dist-android/*
          if-no-files-found: error
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/arcalo-release.jks" src-tauri/gen/android/keystore.properties
      # The emulator tests (ci.yml, android-e2e): a debug build for x86_64, signed with the debug
      # key, with the WebView's DevTools socket (MainActivity.kt). Not part of a release.
      - name: Build the debug APK for the emulator tests
        if: inputs.tag == ''
        working-directory: src-tauri
        run: |
          rm -rf gen/android/app/build/outputs/apk
          cargo tauri android build --debug --apk --target x86_64
          mkdir -p "$RUNNER_TEMP/apk-debug"
          apk=$(find gen/android/app/build/outputs/apk -name '*debug*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" "$RUNNER_TEMP/apk-debug/arcalo-debug.apk"
      - uses: actions/upload-artifact@v4
        if: inputs.tag == ''
        with:
          name: arcalo-android-debug
          path: ${{ runner.temp }}/apk-debug/arcalo-debug.apk
          if-no-files-found: error
          retention-days: 7
