name: Release

# Pushing a tag `v1.2.3` builds the Windows installer (per-user NSIS, no admin rights) and the
# portable Windows ZIP (Annalo.exe + marker file, data next to the executable), the Linux
# packages (.deb, .AppImage) and the macOS disk images (Apple Silicon and Intel) and publishes
# them as a GitHub release.
#
# Automatic updates: the public key is committed (src-tauri/updater.pub). With the repository
# secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (README →
# „Automatische Updates einrichten“) the Windows and macOS builds are signed, the updater is
# switched on and `latest.json` is published. Without them the release is built unsigned and the
# updater stays off.
#
# macOS: ad-hoc signed by default (not notarized). With the secrets APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY the app is signed with the Developer ID;
# with APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID it is notarized as well (README → „macOS“).

# Alternatively „Run workflow“ (Actions → Release) with a version: the workflow creates the
# annotated tag v<version> on the selected branch itself, with docs/releases/v<version>.md as
# its message, and builds that. If the tag exists already, it is built again (to re-run a
# failed release with a fixed workflow).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 1.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $INPUT_VERSION is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            # Re-run of a release: build the existing tag (the workflow itself comes from the branch).
            echo "::notice::Tag $TAG exists, building it again."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOTES="docs/releases/$TAG.md"
          [ -f "$NOTES" ] || { echo "Annalo $VERSION" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a --cleanup=verbatim "$TAG" -F "$NOTES"  # keep "## New" headings: # is not a comment here
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            updater: true
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            updater: false
          - name: macOS (Apple Silicon)
            os: macos-14
            bundles: app,dmg
            target: aarch64-apple-darwin
            arch: aarch64
            updater: true
          # Cross-compiled on the Apple Silicon runner (GitHub is retiring the Intel runners).
          - name: macOS (Intel)
            os: macos-14
            bundles: app,dmg
            target: x86_64-apple-darwin
            arch: x64
            updater: true
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}

      # The tag is the version (tauri.conf.json is what the updater compares).
      - name: Version from tag
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          export VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export UPDATER_SIGN=0
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ "${{ matrix.updater }}" = "true" ]; then UPDATER_SIGN=1; fi
          echo "UPDATER_SIGN=$UPDATER_SIGN" >> "$GITHUB_ENV"
          if [ "$UPDATER_SIGN" = "1" ]; then
            # Compiled into the app (option_env!): switches the updater on in this build.
            ANNALO_UPDATER_PUBKEY="$(tr -d '\r\n' < src-tauri/updater.pub)"
            export ANNALO_UPDATER_PUBKEY
            echo "ANNALO_UPDATER_PUBKEY=$ANNALO_UPDATER_PUBKEY" >> "$GITHUB_ENV"
          fi
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.VERSION;
            if (process.env.UPDATER_SIGN === "1") {
              c.bundle.createUpdaterArtifacts = true;
              c.plugins.updater.pubkey = process.env.ANNALO_UPDATER_PUBKEY.trim();
            }
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            const t = "Cargo.toml";
            fs.writeFileSync(t, fs.readFileSync(t, "utf8").replace(/^version = "[^"]*"/m, `version = "${process.env.VERSION}"`));
          '
          if [ "$UPDATER_SIGN" = "0" ]; then
            # Unsigned build: the updater stays off (it is only enabled with a public key).
            echo "TAURI_SIGNING_PRIVATE_KEY=" >> "$GITHUB_ENV"
            echo "::notice::Building without updater signing (secrets not set)."
          fi

      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2 xdg-utils

      - run: npm ci --prefix ui
      - run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        shell: bash
        working-directory: src-tauri
        env:
          MAC_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MAC_ID: ${{ secrets.APPLE_ID }}
          MAC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARGS=(--bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then ARGS+=(--target "${{ matrix.target }}"); fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Tauri reads the APPLE_* variables. They are only set when the secrets exist: an
            # empty APPLE_CERTIFICATE would fail the build. Without them: ad-hoc signature ("-").
            if [ -n "$MAC_CERTIFICATE" ] && [ -n "$MAC_SIGNING_IDENTITY" ]; then
              export APPLE_CERTIFICATE="$MAC_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
              export APPLE_SIGNING_IDENTITY="$MAC_SIGNING_IDENTITY"
              echo "::notice::Signing with the Developer ID certificate."
              if [ -n "$MAC_ID" ] && [ -n "$MAC_PASSWORD" ] && [ -n "$MAC_TEAM_ID" ]; then
                export APPLE_ID="$MAC_ID" APPLE_PASSWORD="$MAC_PASSWORD" APPLE_TEAM_ID="$MAC_TEAM_ID"
                echo "::notice::Notarizing with Apple."
              fi
            else
              echo "::notice::Ad-hoc signature (no Developer ID secrets): not notarized."
            fi
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            # linuxdeploy is an AppImage itself: extract instead of mounting (no FUSE on the
            # runners), and log its output so a failing AppImage step shows why.
            export APPIMAGE_EXTRACT_AND_RUN=1
            ARGS+=(--verbose)
          fi
          cargo tauri build "${ARGS[@]}"

      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist
          B=target/release/bundle
          if [ "${{ runner.os }}" = "macOS" ]; then
            B="target/${{ matrix.target }}/release/bundle"
            ARCH="${{ matrix.arch }}"
            cp "$B"/dmg/*.dmg "dist/Annalo_${VERSION}_${ARCH}.dmg"
            # Updater archive of the .app: only in signed builds (createUpdaterArtifacts).
            TGZ="$(ls "$B"/macos/*.app.tar.gz 2>/dev/null | head -1)"
            if [ -n "$TGZ" ] && [ -f "$TGZ.sig" ]; then
              cp "$TGZ" "dist/Annalo_${VERSION}_${ARCH}.app.tar.gz"
              cp "$TGZ.sig" "dist/Annalo_${VERSION}_${ARCH}.app.tar.gz.sig"
            fi
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp "$B"/nsis/*.exe dist/Annalo_${VERSION}_x64-setup.exe
            if [ -f "$(ls "$B"/nsis/*.exe.sig 2>/dev/null | head -1)" ]; then
              cp "$B"/nsis/*.exe.sig dist/Annalo_${VERSION}_x64-setup.exe.sig
            fi
            # Portable ZIP: the same executable with the marker file next to it (all data then
            # lives in data\ beside Annalo.exe). Not part of latest.json: portable copies are
            # updated by hand from the release page.
            P="$RUNNER_TEMP/Annalo-portable"
            rm -rf "$P" && mkdir -p "$P"
            cp target/release/annalo.exe "$P/Annalo.exe"
            printf 'Annalo portabel\r\n' > "$P/annalo-portable"
            {
              printf 'Annalo %s – portable Version\r\n\r\n' "$VERSION"
              printf 'Den Ordner an einen beliebigen Ort entpacken (z. B. auf einen USB-Stick) und Annalo.exe starten.\r\n'
              printf 'Die Datei „annalo-portable“ schaltet den portablen Modus ein: alle Daten (Datenbank, Einstellungen,\r\n'
              printf 'Anhänge, Sicherungen, Protokoll, WebView-Daten) liegen im Ordner „data“ neben Annalo.exe.\r\n\r\n'
              printf 'Im portablen Modus schreibt Annalo nichts in das Benutzerprofil des Rechners: kein Autostart,\r\n'
              printf 'keine Sprungliste, kein Installer. Zugangsdaten (API-Schlüssel, Git-Token, Proxy-Passwort) bleiben\r\n'
              printf 'in der Windows-Anmeldeinformationsverwaltung des jeweiligen Rechners und werden auf einem anderen\r\n'
              printf 'Rechner neu eingegeben.\r\n\r\n'
              printf 'Update: die neue ZIP-Datei herunterladen und über diesen Ordner entpacken; der Ordner „data“ bleibt.\r\n'
              printf 'Voraussetzung: Microsoft Edge WebView2 Runtime (unter Windows 10 und 11 vorinstalliert).\r\n'
            } > "$P/LIESMICH.txt"
            (cd "$P" && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/Annalo_${VERSION}_x64-portable.zip" Annalo.exe annalo-portable LIESMICH.txt >/dev/null)
          else
            cp "$B"/deb/*.deb dist/Annalo_${VERSION}_amd64.deb
            cp "$B"/appimage/*.AppImage dist/Annalo_${VERSION}_amd64.AppImage
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish release
    needs: [tag, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0
      # The checkout may leave the tag lightweight; fetch the annotated tag object for its message.
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes and update feed
        shell: bash
        run: |
          VERSION="${TAG#v}"
          NOTES="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/-----BEGIN PGP SIGNATURE-----/,$d')"
          if [ "$(git cat-file -t "$TAG")" != "tag" ] || [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Annalo $VERSION"
          fi
          printf '%s\n' "$NOTES" > notes.md
          # Update feed: every platform whose update file was signed.
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const files = {
              "windows-x86_64": `Annalo_${version}_x64-setup.exe`,
              "darwin-aarch64": `Annalo_${version}_aarch64.app.tar.gz`,
              "darwin-x86_64": `Annalo_${version}_x64.app.tar.gz`,
            };
            const platforms = {};
            for (const [platform, file] of Object.entries(files)) {
              const sig = `dist/${file}.sig`;
              if (fs.existsSync(sig)) platforms[platform] = { signature: fs.readFileSync(sig, "utf8").trim(), url: `${process.env.BASE}/${file}` };
            }
            if (Object.keys(platforms).length) {
              const feed = { version, notes: fs.readFileSync("notes.md", "utf8"), pub_date: new Date().toISOString(), platforms };
              fs.writeFileSync("dist/latest.json", JSON.stringify(feed, null, 2));
              console.log("latest.json:", Object.keys(platforms).join(", "));
            }
          ' "$VERSION"
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Annalo ${{ needs.tag.outputs.tag }}
          body_path: notes.md
          files: dist/*
