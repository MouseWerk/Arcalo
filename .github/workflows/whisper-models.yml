name: Whisper models

# Publishes the Whisper models of voice notes to the release `whisper-models-v1` (the default
# download source of Arcalo), checked against the SHA-256 in the source code. Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, check and upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/publish-whisper-models.sh
