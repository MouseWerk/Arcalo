name: iOS

# The iPhone and iPad app (docs/ios.md, docs/release/ios.md), modeled on Arcalo Mail's. Called by
# CI on every push and by the release (release.yml) with its tag.
#
# Always, without any Apple account: the iOS code is linted for the device, the Xcode project is
# made (`cargo tauri ios init`, then scripts/ios-project.py), a debug build for the simulator is
# built unsigned and checked in the simulator on an iPhone, a 13" iPad Pro and an iPad mini,
# upright and sideways (scripts/ios-smoke.sh: the interface, sideways overflow, the safe areas,
# console errors; the screenshots are the artifact `ios-simulator`).
#
# With the Apple secrets (APPLE_TEAM_ID, IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
# IOS_PROVISIONING_PROFILE_BASE64): the app is archived, signed and exported for App Store
# Connect (artifact `arcalo-ios`); a release also uploads it to TestFlight with the App Store
# Connect API key (APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
# APP_STORE_CONNECT_API_KEY_BASE64). Without them those steps are skipped with a notice.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.22.0 (empty: the commit of the calling run)"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: iOS app (simulator check, TestFlight)
    runs-on: macos-15
    timeout-minutes: 150
    env:
      TAG: ${{ inputs.tag }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      # A release: the tag is the version (CFBundleShortVersionString; the run number is the build).
      - name: Version from tag
        if: inputs.tag != ''
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            const t = "Cargo.toml";
            fs.writeFileSync(t, fs.readFileSync(t, "utf8").replace(/^version = "[^"]*"/m, `version = "${process.env.VERSION}"`));
          '
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      # The iOS-only code (Keychain, UIKit, BackgroundTasks, the notification buttons) is only
      # compiled here.
      - name: Lint the iOS code (device)
        run: cargo clippy -p arcalo --lib --target aarch64-apple-ios -- -D warnings
      - name: Tauri CLI and XcodeGen
        run: |
          cargo install tauri-cli --version "^2" --locked
          command -v xcodegen || brew install xcodegen
      # The Xcode project is made here (docs/ios.md: what Arcalo changes in it lives in
      # src-tauri/ios, Info.ios.plist and tauri.ios.conf.json). The macOS Info.plist (the
      # microphone of the voice notes) would be merged into the iOS app's: iOS has no voice notes.
      - name: Xcode project
        working-directory: src-tauri
        run: |
          rm Info.plist
          cargo tauri ios init --ci
          python3 ../scripts/ios-project.py
          (cd gen/apple && xcodegen generate --spec project.yml)
      - name: Simulator build (debug, unsigned)
        working-directory: src-tauri
        run: |
          cargo tauri ios build --target aarch64-sim --debug --no-sign --ci
          app=$(find gen/apple/build -maxdepth 3 -name '*.app' -type d | head -n 1)
          test -n "$app"
          echo "SIM_APP=$PWD/$app" >> "$GITHUB_ENV"
          plutil -p "$app/Info.plist" | grep -E 'CFBundleIdentifier|UIDeviceFamily|UIBackgroundModes|NSMicrophone' || true
      - name: Check in the simulator (iPhone, iPad Pro 13", iPad mini; upright and sideways)
        run: scripts/ios-smoke.sh "$SIM_APP" ios-simulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: ios-simulator
          if-no-files-found: ignore
      # The generated project, for a look in Xcode (without the build output).
      - name: Pack the generated project
        if: always()
        run: |
          if [ -d src-tauri/gen/apple ]; then
            tar -czf gen-apple.tar.gz --exclude 'apple/build' --exclude 'apple/Externals' -C src-tauri/gen apple
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcode-project
          path: gen-apple.tar.gz
          if-no-files-found: ignore

      - name: Signing set up?
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$IOS_CERTIFICATE_BASE64" ] && [ -n "$IOS_CERTIFICATE_PASSWORD" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::notice title=iOS::No signed iOS build: the APPLE_TEAM_ID, IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD and IOS_PROVISIONING_PROFILE_BASE64 secrets are not set (docs/release/ios.md)."
          fi
      # Signed with the distribution certificate and the App Store profile (Tauri reads
      # IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD and IOS_MOBILE_PROVISION); the run number is the
      # build number App Store Connect needs to grow.
      - name: Signed archive for App Store Connect
        if: env.SIGNED == '1'
        working-directory: src-tauri
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          cargo tauri ios build --target aarch64 --export-method app-store-connect --build-number "$GITHUB_RUN_NUMBER" --ci
          mkdir -p ../dist-ios
          find gen/apple/build -name '*.ipa' -exec cp {} ../dist-ios/ \;
          ls -l ../dist-ios
      - uses: actions/upload-artifact@v4
        if: env.SIGNED == '1'
        with:
          name: arcalo-ios
          path: dist-ios/*.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: env.SIGNED == '1' && inputs.tag != ''
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "::notice title=iOS::Not uploaded to TestFlight: the APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_API_KEY_BASE64 secrets are not set (docs/release/ios.md)."
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          ipa=$(ls dist-ios/*.ipa | head -n 1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
