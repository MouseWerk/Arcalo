name: CI

on:
  push:
  pull_request:

env:
  # whisper.cpp (voice notes) for every CPU of its kind, not only the build machine (x86: AVX2 baseline).
  GGML_NATIVE: "OFF"

jobs:
  core:
    name: Core, UI and end-to-end tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (WebKitGTK, WebDriver, Xvfb)
        run: |
          sudo apt-get update
          # libasound2-dev: microphone (cpal); cmake and libclang: whisper.cpp for voice notes.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev webkit2gtk-driver xvfb x11-utils libasound2-dev cmake clang libclang-dev libdbus-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p annalo-core -p annalo-cli
      - run: npm ci --prefix ui && npm run --prefix ui typecheck && npm test --prefix ui
      - run: cargo install tauri-driver --locked
      - name: End-to-end tests against the desktop app
        run: npm ci --prefix e2e && e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      # SQLCipher's vendored OpenSSL (rusqlite `bundled-sqlcipher-vendored-openssl`) is configured
      # with Perl: Strawberry Perl of the runner (Git's perl lacks modules OpenSSL needs). No NASM
      # needed: without it OpenSSL builds without assembly.
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
        working-directory: src-tauri
      # Upgrade path of the rename: an installed Annalo 1.6.0 must become one Arcalo install in the
      # same folder, without the old uninstall entry or Start-menu shortcut (src-tauri/installer/hooks.nsh).
      - name: Upgrade from Annalo 1.6.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uninst = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $old = "$env:RUNNER_TEMP\Annalo_1.6.0_x64-setup.exe"
          Invoke-WebRequest "https://github.com/MouseWerk/Annalo/releases/download/v1.6.0/Annalo_1.6.0_x64-setup.exe" -OutFile $old
          Start-Process $old -ArgumentList "/S" -Wait
          $before = (Get-ItemProperty "$uninst\Annalo").InstallLocation.Trim('"')
          if (-not (Test-Path $before)) { throw "Annalo 1.6.0 not installed: $before" }
          Write-Host "Annalo 1.6.0 in $before"
          $new = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $new.FullName -ArgumentList "/S" -Wait
          if (Test-Path "$uninst\Annalo") { throw "the old Annalo uninstall entry is still there" }
          $after = (Get-ItemProperty "$uninst\Arcalo").InstallLocation.Trim('"')
          if ($after.TrimEnd('\') -ne $before.TrimEnd('\')) { throw "installed into $after instead of $before" }
          if (-not (Get-ChildItem $after -Filter *.exe | Where-Object Name -match '^(annalo|arcalo)\.exe$')) { throw "no program file in $after" }
          $sm = [Environment]::GetFolderPath("Programs")
          if ((Test-Path "$sm\Annalo.lnk") -or (Test-Path "$sm\Annalo\Annalo.lnk")) { throw "old Start-menu shortcut left" }
          if (-not ((Test-Path "$sm\Arcalo.lnk") -or (Test-Path "$sm\Arcalo\Arcalo.lnk"))) { throw "no Arcalo Start-menu shortcut" }
          Write-Host "Upgraded in place: $after"
      - uses: actions/upload-artifact@v4
        with:
          name: arcalo-windows
          path: target/release/bundle/nsis/*.exe

  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      # The macOS-only code (CoreGraphics idle probe, menu bar, title bar overlay, Dock reopen)
      # is only compiled here.
      - run: cargo clippy -p annalo --all-targets -- -D warnings
      - run: cargo test -p annalo-core activity
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Bundle the app (ad-hoc signed)
        run: cargo tauri build --bundles app --target aarch64-apple-darwin
        working-directory: src-tauri
      # ditto keeps the bundle's symlinks and permissions (upload-artifact would not).
      - run: ditto -c -k --keepParent "target/aarch64-apple-darwin/release/bundle/macos/Arcalo.app" Arcalo-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: annalo-macos
          path: Arcalo-macos.zip
