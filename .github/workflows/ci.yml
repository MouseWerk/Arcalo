name: CI

on:
  push:
  pull_request:

# A newer push to the same branch stops the run it supersedes (main gets pushes in quick succession).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # whisper.cpp (voice notes) for every CPU of its kind, not only the build machine (x86: AVX2 baseline).
  GGML_NATIVE: "OFF"

jobs:
  core:
    name: Core, UI and end-to-end tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (WebKitGTK, WebDriver, Xvfb)
        run: |
          sudo apt-get update
          # libasound2-dev: microphone (cpal); cmake and libclang: whisper.cpp for voice notes.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev webkit2gtk-driver xvfb x11-utils libasound2-dev cmake clang libclang-dev libdbus-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p arcalo-core -p arcalo-cli
      # The update installer (AppImage replacement against a file in a temp folder).
      - run: cargo test -p arcalo --lib installer
      - run: npm ci --prefix ui && npm run --prefix ui typecheck && npm test --prefix ui
      - run: cargo install tauri-driver --locked
      - name: End-to-end tests against the desktop app
        run: npm ci --prefix e2e && e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      # SQLCipher's vendored OpenSSL (rusqlite `bundled-sqlcipher-vendored-openssl`) is configured
      # with Perl: Strawberry Perl of the runner (Git's perl lacks modules OpenSSL needs). No NASM
      # needed: without it OpenSSL builds without assembly.
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      # File handling differs on Windows (sharing, flush rights): the backup and encryption tests run here too.
      - name: Core tests on Windows (backups, encryption)
        run: cargo test -p arcalo-core -- backup cipher
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
        working-directory: src-tauri
      # The update install compiled like the release (the updater plugin refused it only in
      # release builds, 1.12 to 1.14.0): writes the setup into a temp folder and builds the
      # installer's command line, starts nothing. The release exe itself cannot be pointed at a
      # test feed (release builds ignore the ARCALO_UPDATE_* variables and CI has no update key).
      # Without fat LTO (tests are built with unwinding, so the release build's crates are not
      # reused anyway); still a release build without debug assertions.
      - name: Update installer in release mode (dry)
        run: cargo test --release -p arcalo --features custom-protocol --lib installer
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      - uses: actions/upload-artifact@v4
        with:
          name: arcalo-windows
          path: target/release/bundle/nsis/*.exe

      # Microsoft Store build (packaging/msix, docs/release/microsoft-store.md): the binary with the
      # `store` feature, packed with a placeholder identity and signed with a throw-away certificate
      # (the Store signs real submissions itself), installed, started and checked, then removed.
      - name: Store build
        run: cargo build --release -p arcalo --features custom-protocol,store
      - name: Pack the MSIX (test identity, self-signed)
        id: msix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $subject = "CN=Arcalo CI Test"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $subject -KeyUsage DigitalSignature `
            -FriendlyName "Arcalo MSIX test" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = [guid]::NewGuid().ToString()
          $pfx = "$env:RUNNER_TEMP\arcalo-test.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          # Trusted for the installation on this runner only.
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\arcalo-test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\arcalo-test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          ./packaging/msix/pack.ps1 -Exe target/release/arcalo.exe -Version $version -OutDir msix `
            -IdentityName "MouseWerk.Arcalo.CITest" -Publisher $subject -PublisherDisplayName "MouseWerk (CI test)" `
            -CertificatePfx $pfx -CertificatePassword $password
      - name: Install, start and remove the MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msix = "${{ steps.msix.outputs.msix }}"
          $data = "$env:APPDATA\de.mousewerk.arcalo"
          if (Test-Path $data) { Remove-Item -Recurse -Force $data }
          Add-AppxPackage -Path $msix
          $pkg = Get-AppxPackage -Name "MouseWerk.Arcalo.CITest"
          if (-not $pkg) { throw "package not installed" }
          Write-Host "Installed $($pkg.PackageFullName) in $($pkg.InstallLocation)"
          if (-not (Test-Path (Join-Path $pkg.InstallLocation "Arcalo.exe"))) { throw "Arcalo.exe missing in the package" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\Arcalo.exe")) { throw "execution alias Arcalo.exe missing" }
          # Started like from Start (with the package identity).
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!Arcalo"
          # The start line in the log: Store mode recognized, and written to the real AppData
          # folder (write virtualization off for de.mousewerk.arcalo, see AppxManifest.xml).
          $log = "$data\logs\arcalo.log"
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not ((Test-Path $log) -and (Select-String -Path $log -Pattern "\(Microsoft Store\)" -Quiet))) {
            Start-Sleep -Seconds 2
          }
          if (-not (Get-Process -Name Arcalo -ErrorAction SilentlyContinue)) { throw "Arcalo is not running" }
          if (-not (Test-Path $log)) {
            Get-ChildItem -Recurse "$env:LOCALAPPDATA\Packages\$($pkg.PackageFamilyName)" -ErrorAction SilentlyContinue | Select-Object -First 30 FullName | Out-Host
            throw "no log in $data (data folder virtualized?)"
          }
          Get-Content $log | Select-Object -First 5 | Out-Host
          if (-not (Select-String -Path $log -Pattern "\(Microsoft Store\)" -Quiet)) { throw "the start line does not report the Store build" }
          # Runs for a while (the window, the database, the tray), then quits.
          Start-Sleep -Seconds 10
          if (-not (Get-Process -Name Arcalo -ErrorAction SilentlyContinue)) { throw "Arcalo ended after the start" }
          if (Select-String -Path $log -Pattern "\bERROR\b" -Quiet) { Select-String -Path $log -Pattern "\bERROR\b" | Out-Host }
          Stop-Process -Name Arcalo -Force
          Start-Sleep -Seconds 2
          Remove-AppxPackage -Package $pkg.PackageFullName
          # The data stays when the package goes (it is not inside the package's private folders).
          if (-not (Test-Path "$data\logs")) { throw "the data folder went with the package" }
          Write-Host "MSIX installed, started, quit and removed; data kept in $data"
      # Windows App Certification Kit: part of the Windows SDK, not on every runner image. The
      # report is uploaded; failures are listed but do not fail the build (a self-signed test
      # package differs from what the Store certifies). Locally: docs/release/microsoft-store.md.
      - name: Windows App Certification Kit
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) {
            Write-Host "::notice::Windows App Certification Kit not on this runner; run it locally (docs/release/microsoft-store.md)."
            exit 0
          }
          $report = "$PWD\msix\wack-report.xml"
          & $appcert reset | Out-Host
          & $appcert test -appxpackagepath "${{ steps.msix.outputs.msix }}" -reportoutputpath $report | Out-Host
          if (-not (Test-Path $report)) { throw "WACK wrote no report" }
          [xml]$x = Get-Content -Raw $report
          $overall = $x.REPORT.OVERALL_RESULT
          Write-Host "WACK overall result: $overall"
          $x.SelectNodes("//TEST[RESULT='FAIL']") | ForEach-Object { Write-Host "::warning::WACK: $($_.NAME) failed" }
          if ($overall -ne "PASS") { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcalo-msix-test
          path: |
            msix/*.msix
            msix/wack-report.xml
          if-no-files-found: ignore

  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      # The macOS-only code (CoreGraphics idle probe, menu bar, title bar overlay, Dock reopen)
      # is only compiled here.
      - run: cargo clippy -p arcalo --all-targets -- -D warnings
      - run: cargo test -p arcalo-core activity
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Bundle the app (ad-hoc signed)
        run: cargo tauri build --bundles app --target aarch64-apple-darwin
        working-directory: src-tauri
      # The update install compiled like the release: unpacks a .app.tar.gz over a bundle in a
      # temp folder (not the installed app).
      - name: Update installer in release mode
        run: cargo test --release -p arcalo --features custom-protocol --target aarch64-apple-darwin --lib installer
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # ditto keeps the bundle's symlinks and permissions (upload-artifact would not).
      - run: ditto -c -k --keepParent "target/aarch64-apple-darwin/release/bundle/macos/Arcalo.app" Arcalo-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: arcalo-macos
          path: Arcalo-macos.zip
