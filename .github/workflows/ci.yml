name: CI

on:
  push:

jobs:
  windows:
    name: Windows diagnosis
    runs-on: windows-latest
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: git config --show-origin --list
      - run: cargo test -p arcalo-core --lib -- a_restored_backup_is_compared_with_the_server_first --nocapture
