name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core, UI and end-to-end tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (WebKitGTK, WebDriver, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev webkit2gtk-driver xvfb x11-utils
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p annalo-core -p annalo-cli
      - run: npm ci --prefix ui && npm run --prefix ui typecheck && npm test --prefix ui
      - run: cargo install tauri-driver --locked
      - name: End-to-end tests against the desktop app
        run: npm ci --prefix e2e && e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: annalo-windows
          path: target/release/bundle/nsis/*.exe

  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui
      # The macOS-only code (CoreGraphics idle probe, menu bar, title bar overlay, Dock reopen)
      # is only compiled here.
      - run: cargo clippy -p annalo --all-targets -- -D warnings
      - run: cargo test -p annalo-core activity
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Bundle the app (ad-hoc signed)
        run: cargo tauri build --bundles app --target aarch64-apple-darwin
        working-directory: src-tauri
      # ditto keeps the bundle's symlinks and permissions (upload-artifact would not).
      - run: ditto -c -k --keepParent "target/aarch64-apple-darwin/release/bundle/macos/Annalo.app" Annalo-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: annalo-macos
          path: Annalo-macos.zip
