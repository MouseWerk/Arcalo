name: Emulator start stress (temporary)
on:
  push:
    branches: [fix-emu-stress]
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gpu: [swiftshader_indirect, guest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci --prefix e2e
      - uses: actions/download-artifact@v4
        with:
          name: arcalo-android-debug
          path: apk
          run-id: 40403415949
          github-token: ${{ github.token }}
      - uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: cd e2e && ARCALO_APK="$GITHUB_WORKSPACE/apk/arcalo-debug.apk" N=80 node android/stress-start.mjs
