[package]
name = "annalo-core"
description = "Local-first core of Arcalo: storage, WBS time tracking, Netzplan scheduling and the LiteLLM engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
cfb = "0.15.0"
futures-util = "0.3.34"
mail-parser = "0.11.9"
minisign-verify = "0.2.5"
plist = "1.10.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "socks"] }
rrule = "0.14.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
# Spans with timings (migrations, AI requests); the desktop shell writes them to its log.
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["time", "macros", "rt"] }
flacenc = "0.5"
claxon = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[dev-dependencies]
schemars = { version = "0.8.22", features = ["chrono"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "net", "io-util"] }
