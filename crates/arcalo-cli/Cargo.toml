[package]
name = "arcalo-cli"
description = "Headless command line for the Arcalo workspace database"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "arcalo_cli"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "arcalo"
path = "src/main.rs"

# The name of 1.14 and earlier (scripts that call `annalo` keep working).
[[bin]]
name = "annalo"
path = "src/bin/annalo.rs"

[dependencies]
arcalo-core = { path = "../arcalo-core" }
chrono = "0.4.45"
clap = { version = "4.6", features = ["derive", "env"] }
serde_json = "1.0.151"
