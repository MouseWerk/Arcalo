[package]
name = "arcalo-cli"
description = "Command line for the Arcalo workspace: everything the app does with notes, tasks and time, for people, scripts and AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo run -p arcalo-cli -- pages list`
default-run = "arcalo-cli"

[lib]
name = "arcalo_cli"
path = "src/lib.rs"
doctest = false

# Not `arcalo`: that is the app's program (src-tauri), which runs the same commands. Both would
# be written to target/<profile>/arcalo, and a test run of this crate replaced the app there.
[[bin]]
name = "arcalo-cli"
path = "src/main.rs"

# The name of 1.14 and earlier (scripts that call `annalo` keep working).
[[bin]]
name = "annalo"
path = "src/bin/annalo.rs"

[dependencies]
arcalo-core = { path = "../arcalo-core" }
chrono = "0.4.45"
clap = { version = "4.6", features = ["derive", "env"] }
# The platform's folders (the app's data and config folders, as Tauri finds them).
dirs = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The system's language for messages before the workspace's settings are read (as the app reads it).
sys-locale = "0.3.2"

# The key of an encrypted workspace is read from the credential store, as the app keeps it.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# The tests' "today" in the zone the commands run in (Europe/Berlin), not the test process's.
chrono-tz = "0.10.4"
