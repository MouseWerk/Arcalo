[workspace]
resolver = "2"
members = ["crates/arcalo-core", "crates/arcalo-cli", "src-tauri"]
# The Tauri shell needs the platform WebView SDK (WebView2 on Windows,
# webkit2gtk on Linux), so it is not part of the default headless build.
default-members = ["crates/arcalo-core", "crates/arcalo-cli", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Argon2id (app lock PIN, password-wrapped database key) is far too slow unoptimized: debug
# builds and tests would wait seconds per hash.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
