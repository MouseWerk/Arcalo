ShortDescription: Local-first notes, tasks and time tracking with SAP and Jira booking, calendar and optional AI.
Description: |-
  Arcalo is a desktop app for Markdown notes that link to each other, tasks, daily notes and time tracking.
  Type /time in any note to book hours on an SAP PS activity or a Jira issue; the weekly timesheet exports
  to SAP CATS, Jira, CSV or JSON. Arcalo shows meetings from Outlook and other calendars next to the booked
  time, transcribes voice notes on your computer and can use AI from your own provider or a local model.
  All data stays in one database on your computer, with no account and no telemetry; Git sync and backups
  are optional.
