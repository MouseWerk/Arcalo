ShortDescription: Lokale Notizen, Aufgaben und Zeiterfassung mit Jira, Kalender und optionaler KI.
Description: |-
  Arcalo ist eine Desktop-App für verknüpfte Notizen, Aufgaben, Tagesnotizen und Zeiterfassung.
  Sie bucht Zeiten auf Jira (Cloud und Server), zeigt Termine aus Outlook und anderen Kalendern neben
  der gebuchten Zeit, nimmt Sprachnotizen auf und nutzt KI deines eigenen Anbieters oder ein lokales
  Modell. Alle Daten bleiben auf deinem Rechner; Git-Sync und Sicherungen sind optional.
