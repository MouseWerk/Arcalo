ShortDescription: Local-first notes, tasks and time tracking with Jira, calendar and optional AI.
Description: |-
  Arcalo is a desktop app for notes that link to each other, tasks, daily notes and time tracking.
  It books time to Jira (Cloud and Server), shows meetings from Outlook and other calendars next to
  the booked time, records voice notes and can use AI from your own provider or a local model.
  All data stays on your computer; optional Git sync and backups.
