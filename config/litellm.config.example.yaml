# Example LiteLLM proxy config for Annalo.
# Start with:  litellm --config config/litellm.config.example.yaml --port 4000
#
# The model names on the left ("model_name") are what Annalo routes to;
# map them to whatever local or cloud models you use.
model_list:
  - model_name: ollama/llama3.2          # Tier "local"
    litellm_params:
      model: ollama/llama3.2
      api_base: http://localhost:11434

  - model_name: ollama/nomic-embed-text  # Embeddings for local RAG
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://localhost:11434

  - model_name: cloud-standard           # Tier "standard"
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud-reasoning          # Tier "reasoning"
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_API_KEY
