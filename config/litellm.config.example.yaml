# Example LiteLLM proxy config for Annalo.
# Start with:  litellm --config config/litellm.config.example.yaml --port 4000
#
# The model names on the left ("model_name") are what Annalo routes to;
# map them to whatever local or cloud models you use.
model_list:
  - model_name: ollama/llama3.2          # Tier "local"
    litellm_params:
      model: ollama/llama3.2
      api_base: http://localhost:11434

  - model_name: ollama/nomic-embed-text  # Embeddings for local RAG
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://localhost:11434
    model_info:
      mode: embedding                    # Annalo offers only embedding models for its search

  - model_name: cloud-standard           # Tier "standard"
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud-reasoning          # Tier "reasoning"
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

# A vLLM server as chat model: start vLLM with --enable-auto-tool-choice and a
# --tool-call-parser so the assistant can use its tools (without, Annalo asks without tools).
#  - model_name: vllmserver
#    litellm_params:
#      model: hosted_vllm/<model>
#      api_base: http://vllm-host:8000/v1
#    model_info:
#      mode: chat

# Every failed request counts against its deployment: after more than `allowed_fails` failures
# within a minute LiteLLM pauses it for `cooldown_time` seconds and answers 429 "No deployments
# available". Annalo waits out a short pause, but with one deployment per model a few more
# allowed failures avoid needless pauses.
router_settings:
  allowed_fails: 3
  cooldown_time: 5

general_settings:
  master_key: os.environ/LITELLM_API_KEY
