<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <title>Annalo</title>
    <style>
      /* Startup animation: shown before the app code loads, removed once the app is ready
         (main.tsx). The mark draws itself, fills with the accent color, the name follows. */
      #splash {
        --splash-bg: #f4f4f5;
        --splash-text: #18181b;
        --splash-muted: #71717a;
        --splash-accent: #6366f1;
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        pointer-events: none;
        transition: opacity 420ms ease, transform 420ms ease;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #splash { --splash-bg: #0e0f11; --splash-text: #ececef; --splash-muted: #8b8b94; --splash-accent: #818cf8; }
      }
      #splash[data-theme="light"] { --splash-bg: #f4f4f5; --splash-text: #18181b; --splash-muted: #71717a; }
      #splash[data-theme="dark"] { --splash-bg: #0e0f11; --splash-text: #ececef; --splash-muted: #8b8b94; }
      #splash.out { opacity: 0; transform: scale(1.03); }
      .splash-inner { display: grid; justify-items: center; gap: 14px; }
      .splash-mark-wrap { position: relative; width: 104px; height: 104px; display: grid; place-items: center; }
      .splash-mark-wrap::before {
        content: "";
        position: absolute;
        inset: -38px;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--splash-accent) 34%, transparent), transparent 64%);
        opacity: 0;
        transform: scale(0.6);
        animation: splash-glow 1100ms 380ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .splash-mark { position: relative; width: 104px; height: 104px; overflow: visible; animation: splash-rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      .splash-mark path {
        fill: var(--splash-accent);
        fill-opacity: 0;
        stroke: var(--splash-accent);
        stroke-width: 16;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: splash-draw 640ms cubic-bezier(0.65, 0, 0.35, 1) 60ms forwards, splash-fill 360ms ease 540ms forwards;
      }
      .splash-word { display: flex; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; color: var(--splash-text); }
      .splash-word span { opacity: 0; transform: translateY(8px); animation: splash-letter 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .splash-word span:nth-child(1) { animation-delay: 560ms; }
      .splash-word span:nth-child(2) { animation-delay: 600ms; }
      .splash-word span:nth-child(3) { animation-delay: 640ms; }
      .splash-word span:nth-child(4) { animation-delay: 680ms; }
      .splash-word span:nth-child(5) { animation-delay: 720ms; }
      .splash-word span:nth-child(6) { animation-delay: 760ms; }
      .splash-tag { font-size: 13px; color: var(--splash-muted); letter-spacing: 0.06em; opacity: 0; animation: splash-fade 420ms ease 820ms forwards; }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-fill { to { fill-opacity: 1; stroke-width: 0; } }
      @keyframes splash-rise { from { opacity: 0; transform: scale(0.86) translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes splash-glow { 0% { opacity: 0; transform: scale(0.6); } 55% { opacity: 1; } 100% { opacity: 0.55; transform: scale(1); } }
      @keyframes splash-letter { to { opacity: 1; transform: none; } }
      @keyframes splash-fade { to { opacity: 1; } }
      /* Reduced motion (system or Settings → Darstellung): the finished logo, then a short fade. */
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before { animation: none !important; opacity: 1 !important; transform: none !important; }
        .splash-mark path { fill-opacity: 1; stroke-width: 0; }
        .splash-mark-wrap::before { opacity: 0.55 !important; }
      }
      #splash[data-reduced] *, #splash[data-reduced] *::before { animation: none !important; opacity: 1 !important; transform: none !important; }
      #splash[data-reduced] .splash-mark path { fill-opacity: 1; stroke-width: 0; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-mark-wrap">
          <svg class="splash-mark" viewBox="0 0 1000 1000"><path pathLength="1" fill-rule="evenodd" d="M458.0,103.4 L491.0,160.1 L96.3,842.8 L256.8,842.8 L305.0,769.1 L235.1,769.1 L268.2,710.6 L687.4,710.6 L760.2,839.9 L902.7,839.9 L574.1,262.0 L535.4,327.2 L628.0,486.8 L502.4,689.8 L377.7,486.8 L574.1,145.9 L1000.0,896.6 L722.4,896.6 L647.8,769.1 L365.4,769.1 L289.9,896.6 L0.0,896.6 Z M502.4,382.0 L562.8,486.8 L502.4,582.2 L441.9,486.8 Z" /></svg>
        </div>
        <div class="splash-word"><span>A</span><span>n</span><span>n</span><span>a</span><span>l</span><span>o</span></div>
        <div class="splash-tag">Notizen · Zeit · KI</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
