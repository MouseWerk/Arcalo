[package]
name = "annalo"
description = "Arcalo desktop shell (Tauri v2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "annalo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
annalo-core = { path = "../crates/annalo-core" }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `macos-private-api`: transparent windows on macOS (the rounded quick-capture and quick-search
# panels). Fine outside the Mac App Store; must match `app.macOSPrivateApi` in tauri.conf.json.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
# The native question of the update rollback, shown before the window exists.
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
semver = "1"
tokio = { version = "1.53.1", features = ["sync", "time"] }
# Quick capture „Auswahl übernehmen“: clipboard text (and the X11 selection).
arboard = { version = "3", default-features = false }
sys-locale = "0.3.2"
whisper-rs = "0.16"
cpal = "0.16"
reqwest = { version = "0.13.5", default-features = false }
# Structured developer log (devlog.rs): levels, spans with timings, the JSON-lines file.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
tracing-appender = "0.2"
# Settings → Protokoll „Diagnosepaket erstellen“.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
# The rename to Arcalo: the autostart entry of the old name (the same crates the autostart plugin uses).
auto-launch = "0.5"
winreg = "0.10"
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation"] }
# Taskbar jump list (COM).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  # Notification toasts with buttons (notifyact.rs).
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
] }

# Quick capture/search over full-screen apps on every Space (NSWindow collection behaviour).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Linux: secrets in the Secret Service (GNOME Keyring, KWallet) over D-Bus (libdbus), the
# file only when none answers. Notifications with buttons (freedesktop actions).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
notify-rust = "4.18"

[features]
# Used by `cargo tauri build`/`dev`; debug builds without it load the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
