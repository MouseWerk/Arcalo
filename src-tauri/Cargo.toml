[package]
name = "annalo"
description = "Annalo desktop shell (Tauri v2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "annalo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
annalo-core = { path = "../crates/annalo-core" }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `macos-private-api`: transparent windows on macOS (the rounded quick-capture and quick-search
# panels). Fine outside the Mac App Store; must match `app.macOSPrivateApi` in tauri.conf.json.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.53.1", features = ["time"] }
# Quick capture „Auswahl übernehmen“: clipboard text (and the X11 selection).
arboard = { version = "3", default-features = false }
sys-locale = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation"] }
# Taskbar jump list (COM).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
] }

# Quick capture/search over full-screen apps on every Space (NSWindow collection behaviour).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[features]
# Used by `cargo tauri build`/`dev`; debug builds without it load the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
