ShortDescription: Lokale Notizen, Aufgaben, Termine und Zeiterfassung mit Export nach SAP CATS und Jira, KI optional.
Description: |-
  Arcalo ist eine Desktop-App für deinen Arbeitstag: Markdown-Notizen mit [[Links]] und Backlinks, Aufgaben
  und Projekte, Termine aus Outlook Classic und ICS-Kalendern und Zeiterfassung. Mit /zeit in einer beliebigen
  Notiz buchst du Stunden auf einen SAP-PS-Vorgang oder ein Jira-Issue; den Wochenzettel exportierst du nach
  SAP CATS, als Jira-Worklogs, CSV oder JSON. Jira-Issues öffnest und bearbeitest du direkt in der App. Einen
  Obsidian-Vault importierst du so, wie er ist. Der Assistent nutzt die KI-Anbieter, die du einträgst (Ollama,
  LiteLLM, OpenAI-kompatibel, Azure OpenAI), oder du lässt KI ganz aus. Alle Daten bleiben in einer Datenbank
  auf deinem Rechner, ohne Konto und ohne Telemetrie; Git-Sync, Sicherungen und Verschlüsselung sind optional.
  Installation pro Benutzer, ohne Adminrechte.
