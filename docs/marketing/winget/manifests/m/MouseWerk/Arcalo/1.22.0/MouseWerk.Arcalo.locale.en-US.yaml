ShortDescription: Local-first notes, tasks, meetings and time tracking with SAP CATS and Jira export and optional AI.
Description: |-
  Arcalo is a desktop app for the workday: Markdown notes with [[links]] and backlinks, tasks and projects,
  meetings from Outlook Classic and ICS calendars, and time tracking. Type /time in any note to book hours on
  an SAP PS activity or a Jira issue; the weekly timesheet exports to SAP CATS, Jira worklogs, CSV or JSON.
  Jira issues open inside the app and can be edited there. An Obsidian vault imports as it is. The optional
  assistant uses the AI providers you add (Ollama, LiteLLM, OpenAI-compatible, Azure OpenAI) or none at all.
  All data stays in one database on your computer, with no account and no telemetry; Git sync, backups and
  encryption are optional. Installs per user without admin rights.
